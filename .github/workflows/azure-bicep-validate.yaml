name: Validate bicep scripts
on:
  workflow_dispatch:
  push:
    careers: 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
       name: Checkout
        uses: actions/checkout@v2
runs-on: Windows
       name: Azure CLI script
        uses: azure/CLI@v1
        with:
          inlineScript: az config set bicep.use_binary_from_path=false && az bicep build -f infra/main.bicep
